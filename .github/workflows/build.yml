name: "Build"
on:
  push:
    branches:
      - master
  workflow_call:
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  containerize:
    needs:
      - checks
    name: ⚙️ Build Docker image

    uses: ./.github/workflows/docker.yml
    with:
      tags: ghcr.io/szpontniki/firmware:latest
