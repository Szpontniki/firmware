name: "Release"
on:
  release:
    types: [published]

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/check.yml

  containerize:
    needs:
      - checks
    name: ⚙️ Build Docker images
    runs-on: ubuntu-latest

    uses: ./.github/workflows/docker-build.yml
    with:
      tags: |
        ghcr.io/szpontniki/firmware:${{ github.event.release.tag_name }}
        ghcr.io/szpontniki/firmware:latest
